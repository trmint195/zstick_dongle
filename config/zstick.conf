# 2.4G Dongle Receiver
CONFIG_ZMK_2G4_DONGLE=y
CONFIG_ZMK_2G4_AES_KEY="552f38566a6a1d2e086641f68a2d43c8"

# # USB
CONFIG_ZMK_USB=y

# No BLE on dongle
CONFIG_ZMK_BLE=n

# HID
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_INDICATORS=y

# No sleep on dongle (always USB powered)
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0
